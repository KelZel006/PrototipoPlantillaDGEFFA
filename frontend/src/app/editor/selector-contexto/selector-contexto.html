<section class="tarjeta selector" aria-label="Contexto de la plantilla">
  <div class="lista">
    <label class="etiqueta" for="lista-rubro">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3" />
      </svg>
      Rubro
    </label>
    <select
      id="lista-rubro"
      class="control"
      [value]="contexto.rubro()?.id ?? ''"
      (change)="alCambiarRubro($any($event.target).value)"
    >
      <option value="">Seleccione un rubro</option>
      @for (rubro of rubros(); track rubro.id) {
        <option [value]="rubro.id" [selected]="rubro.id === contexto.rubro()?.id">{{ rubro.nombre }}</option>
      }
    </select>
  </div>

  <div class="lista">
    <label class="etiqueta" for="lista-subrubro">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m12 3 9 5-9 5-9-5 9-5ZM3 13l9 5 9-5" />
      </svg>
      Sub Rubro
    </label>
    <select
      id="lista-subrubro"
      class="control"
      [disabled]="!contexto.rubro() || cargandoSubRubros()"
      [value]="contexto.subRubro()?.id ?? ''"
      (change)="alCambiarSubRubro($any($event.target).value)"
    >
      <option value="">
        @if (!contexto.rubro()) {
          Primero seleccione un rubro
        } @else if (cargandoSubRubros()) {
          Cargando…
        } @else {
          Seleccione un sub rubro
        }
      </option>
      @for (subRubro of subRubros(); track subRubro.id) {
        <option [value]="subRubro.id" [selected]="subRubro.id === contexto.subRubro()?.id">{{ subRubro.nombre }}</option>
      }
    </select>
  </div>

  <div class="lista">
    <label class="etiqueta" for="lista-tipo">
      <svg class="icono" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5ZM14 3v5h5M9 13h6M9 17h6" />
      </svg>
      Tipo Documento
    </label>
    <select
      id="lista-tipo"
      class="control"
      [value]="contexto.tipoDocumento()?.id ?? ''"
      (change)="alCambiarTipoDocumento($any($event.target).value)"
    >
      <option value="">Seleccione un tipo de documento</option>
      @for (tipo of tiposDocumento(); track tipo.id) {
        <option [value]="tipo.id" [selected]="tipo.id === contexto.tipoDocumento()?.id">{{ tipo.nombre }}</option>
      }
    </select>
  </div>

  @if (error(); as mensaje) {
    <div class="aviso aviso-error" role="alert">
      <span>{{ mensaje }}</span>
      <button type="button" class="boton boton-secundario" (click)="recargar()">Reintentar</button>
    </div>
  }
</section>

<div class="pestanas" role="tablist" aria-label="Secciones de la resolución">
  @for (pestana of pestanas; track pestana.seccion) {
    <button
      type="button"
      role="tab"
      class="pestana"
      [id]="'pestana-' + pestana.seccion"
      [attr.aria-selected]="pestana.seccion === activa()"
      [attr.aria-controls]="'panel-' + pestana.seccion"
      [attr.aria-disabled]="!pestana.disponible"
      [title]="pestana.disponible ? pestana.seccion : pestana.seccion + ': se habilitará en una fase posterior'"
      (click)="seleccionar(pestana)"
    >
      @switch (pestana.seccion) {
        @case ('Cabecera') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5ZM14 3v5h5M9 13h6M9 17h4" /></svg>
        }
        @case ('Considerando') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M4 12h16M4 18h10M18 4v4M14 6h8" /></svg>
        }
        @case ('Resuelve') {
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="m8 12 3 3 5-6" /></svg>
        }
      }
      <span>{{ pestana.seccion }}</span>
      @if (!pestana.disponible) {
        <span class="proximamente">Próximamente</span>
      }
    </button>
  }
</div>

<div class="panel" role="tabpanel" [id]="'panel-' + activa()" [attr.aria-labelledby]="'pestana-' + activa()">
  <app-editor-seccion [plantilla]="plantilla()" [seccion]="activa()" [nombre]="pestanaActiva().nombre" />
</div>

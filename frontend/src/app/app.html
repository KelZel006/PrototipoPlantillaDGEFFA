<header class="barra-superior">
  <a class="marca" routerLink="/consolidados">
    <span class="logotipo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5ZM14 3v5h5M9 13h6M9 17h4" /></svg>
    </span>
    <div>
      <h1>Editor de Resoluciones</h1>
      <p>Documentos de plantillas</p>
    </div>
  </a>
  <nav class="navegacion" [attr.aria-label]="'Secciones de ' + unidades.nombreActual()">
    <a [routerLink]="['/unidades', unidades.actual(), 'consolidados']" routerLinkActive="activo">Documentos Plantillas</a>
    <a [routerLink]="['/unidades', unidades.actual(), 'vigentes']" routerLinkActive="activo">Plantillas vigentes</a>
  </nav>
  <div class="sesion">
    <label class="usuario">
      <span>Usuario de prueba</span>
      <select class="control control-compacto" (change)="usuario.seleccionar($any($event.target).value)">
        @for (u of usuario.usuarios(); track u.id) {
          <option [value]="u.id" [selected]="u.id === usuario.id()">{{ u.nombreCompleto }} · {{ nombresRoles(u.roles) }}</option>
        } @empty {
          <option [value]="usuario.id()" selected>{{ usuario.id() }}</option>
        }
      </select>
    </label>
    <span class="insignia insignia-prueba">Prototipo · datos de prueba</span>
  </div>
</header>

<nav class="menu-unidades" aria-label="Unidades">
  @for (u of unidades.unidades(); track u.id) {
    <a [routerLink]="['/unidades', u.id, 'consolidados']" [class.activa]="u.id === unidades.actual()"
      [attr.aria-current]="u.id === unidades.actual() ? 'page' : null">{{ u.nombre }}</a>
  }
</nav>

<main class="contenedor">
  <router-outlet />
  <details class="diagnostico">
    <summary>Estado de los datos de prueba</summary>
    <app-estado-datos />
  </details>
</main>

<app-dialogo-confirmacion />
<app-avisos />
